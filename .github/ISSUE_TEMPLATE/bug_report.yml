name: Bug Report
description: Report an issue, unexpected error, or failed analysis in DevDNA
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please provide reproduction details below.
  - type: input
    id: version
    attributes:
      label: DevDNA Version / Commit
      description: The commit SHA or release version you are running.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or repository structure that triggers the issue.
      placeholder: |
        1. Ingest repository ...
        2. Navigate to What-If Lab
        3. Trigger scenario ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Messages
      description: Sanitize any private API keys or personal paths before pasting!
