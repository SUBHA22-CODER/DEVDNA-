name: Feature Request
description: Propose a new feature, analyzer capability, or UX enhancement for DevDNA
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for proposing an enhancement to DevDNA!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or architectural blindspot?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or frameworks considered.
